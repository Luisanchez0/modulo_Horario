services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_me_mysql_root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-docentes_db}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p${MYSQL_ROOT_PASSWORD:-change_me_mysql_root_password}"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_postgres_password}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 10

  usuarios-service:
    build:
      context: ./usuarios-service
    environment:
      DATABASE_URL: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD:-change_me_mysql_root_password}@mysql/docentes_db
      JWT_SECRET: ${JWT_SECRET:-change_me_jwt_secret}
      ADMIN_CREATION_KEY: ${ADMIN_CREATION_KEY:-change_me_admin_creation_key}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-change_me_internal_api_key}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:5173,http://localhost:8001,http://localhost:8002,http://localhost:8003,http://localhost:8004}
      APP_PORT: 8001
    ports:
      - "8001:8001"
    depends_on:
      mysql:
        condition: service_healthy

  aulas-service:
    build:
      context: ./aulas-service
    environment:
      DATABASE_URL: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD:-change_me_mysql_root_password}@mysql/aulas_db
      USUARIOS_SERVICE_URL: http://usuarios-service:8001
      UPSTREAM_TIMEOUT_SECONDS: 5
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:5173,http://localhost:8001,http://localhost:8002,http://localhost:8003,http://localhost:8004}
      APP_PORT: 8003
    ports:
      - "8003:8003"
    depends_on:
      mysql:
        condition: service_healthy

  materias-service:
    build:
      context: ./materias-service
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8002"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-change_me_postgres_password}@postgres:5432/materias_db
      USUARIOS_SERVICE_URL: http://usuarios-service:8001
      UPSTREAM_TIMEOUT_SECONDS: 5
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:5173,http://localhost:8001,http://localhost:8002,http://localhost:8003,http://localhost:8004}
      APP_PORT: 8002
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      usuarios-service:
        condition: service_started

  horario-service:
    build:
      context: ./horario-service
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-change_me_postgres_password}@postgres:5432/horarios_db
      APP_NAME: Horario Service
      APP_PORT: 8004
      USUARIOS_SERVICE_URL: http://usuarios-service:8001
      MATERIAS_SERVICE_URL: http://materias-service:8002
      AULAS_SERVICE_URL: http://aulas-service:8003
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-change_me_internal_api_key}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:5173,http://localhost:8001,http://localhost:8002,http://localhost:8003,http://localhost:8004}
      UPSTREAM_TIMEOUT_SECONDS: 5
    ports:
      - "8004:8004"
    depends_on:
      postgres:
        condition: service_healthy
      usuarios-service:
        condition: service_started
      materias-service:
        condition: service_started
      aulas-service:
        condition: service_started

volumes:
  mysql_data:
  postgres_data:
